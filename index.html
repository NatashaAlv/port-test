<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fox Rift / Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="landing-page">
    <div class="landing-scene">
      <header class="hero-copy" aria-label="Portfolio title">
        <h1>FOX RIFT / PORTFOLIO</h1>
        <div class="floating-words" aria-label="Role text">
          <span>creative technologist</span>
          <span>immersive designer</span>
          <span>web designer</span>
          <span>technical artist</span>
        </div>
      </header>

      <div class="scene-objects" aria-label="Landing scene">
        <div class="fox-wrap">
          <img src="img/fox_sit.png" alt="Fox sitting on the ground" class="fox" />
        </div>

        <a href="home.html" class="door-link" aria-label="Enter home page">
          <span>Start</span>
          <img src="img/door.jpg" alt="Door to enter portfolio" class="door" />
        </a>
      </div>

      <div class="ground-names" aria-label="Placeholder names">
        <span>Olivia</span>
        <span>Rhea</span>
        <span>Finn</span>
        <span>Milo</span>
        <span>Aria</span>
        <span>Juno</span>
      </div>
    </div>
  </body>
</html>
