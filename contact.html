<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="index.html" class="brand">NOVA</a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="home.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </header>

    <main class="page-content contact-page">
      <section class="page-hero">
        <p class="eyebrow">CONTACT</p>
        <h1>Let’s make something great.</h1>
      </section>

      <section class="contact-grid">
        <article class="info-card">
          <h3>Get in touch</h3>
          <p>Email: hello@example.com</p>
          <p>Instagram: @yourhandle</p>
          <p>Location: Somewhere creative</p>
        </article>

        <form class="info-card form-card">
          <label>
            Name
            <input type="text" placeholder="Your name" />
          </label>
          <label>
            Email
            <input type="email" placeholder="you@example.com" />
          </label>
          <label>
            Message
            <textarea rows="5" placeholder="Tell me about your project"></textarea>
          </label>
          <button type="submit" class="btn primary">Send</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
